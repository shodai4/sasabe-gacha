<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>画材マネージャー ｜ 蔵書マネージャーの画材版 PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-20">

    <!-- アプリヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#3BA29B] to-[#F0A732] flex items-center justify-center text-white shadow-sm">
                <i data-lucide="palette" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-black text-slate-800 text-sm md:text-base leading-tight">画材マネージャー</h1>
                <p class="text-[10px] text-slate-400">蔵書マネージャーの画材版 ｜ 手持ち在庫管理</p>
            </div>
        </div>
        <div class="flex items-center gap-2 text-xs">
            <span class="bg-[#3BA29B]/10 text-[#1F7068] font-bold px-2 py-1 rounded-lg">PWA 0円試作版</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-2xl mx-auto w-full px-4 py-4 flex-1 flex flex-col gap-4">

        <!-- タブ1: マイパレット（手持ち画材一覧） -->
        <section id="viewPalette" class="flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="font-black text-slate-800 text-base">手持ち画材（マイパレット）</h2>
                    <p class="text-xs text-slate-400">登録済み画材: <b id="totalStockCount" class="text-[#1F7068]">0</b> 点</p>
                </div>
                <div class="flex gap-1.5 text-xs">
                    <select id="filterCategory" onchange="renderStockList()" class="bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 font-bold text-slate-700 text-xs focus:ring-2 focus:ring-[#3BA29B] focus:outline-none">
                        <option value="all">すべての画材</option>
                        <option value="油絵具">油絵具</option>
                        <option value="アクリル">アクリル</option>
                        <option value="筆">筆・刷毛</option>
                        <option value="画溶液">画液・メディウム</option>
                    </select>
                </div>
            </div>

            <!-- リスト表示エリア -->
            <div id="stockListContainer" class="flex flex-col gap-2.5">
                <!-- 動的レンダリング -->
            </div>
        </section>

        <!-- タブ2: バーコードスキャン＆検索登録 -->
        <section id="viewScan" class="hidden flex flex-col gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i data-lucide="scan-barcode" class="w-4 h-4 text-[#3BA29B]"></i>
                        バーコード (JAN) 読み取り
                    </h2>
                    <span class="text-[11px] text-slate-400">カメラか番号で登録</span>
                </div>

                <!-- スキャナー枠（カメラ枠イメージ） -->
                <div class="w-full bg-slate-900 rounded-xl p-6 text-center text-white flex flex-col items-center justify-center gap-3 relative overflow-hidden min-h-[180px]">
                    <div class="absolute inset-x-8 top-1/2 -translate-y-1/2 h-0.5 bg-red-500 shadow-lg shadow-red-500/50 animate-pulse"></div>
                    <i data-lucide="barcode" class="w-12 h-12 text-slate-400"></i>
                    <p class="text-xs text-slate-300">絵具のチューブのバーコードを枠内に合わせてください</p>
                    <button onclick="simulateCameraScan()" class="bg-[#3BA29B] hover:bg-[#2BB3A3] text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md transition flex items-center gap-1.5 active:scale-95">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                        <span>テスト用バーコードをスキャン</span>
                    </button>
                </div>

                <!-- 手動JAN / キーワード検索 -->
                <div class="flex gap-2">
                    <input type="text" id="scanInput" placeholder="バーコード番号 (49...) または 色名" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-[#3BA29B] focus:outline-none">
                    <button onclick="searchAndAdd()" class="bg-[#1F7068] hover:bg-[#16524C] text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-1 transition">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span>検索</span>
                    </button>
                </div>

                <!-- 検出された商品カード（プレビュー） -->
                <div id="scannedResultCard" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col gap-2.5">
                    <div class="flex justify-between items-start">
                        <div>
                            <span id="detectedBrand" class="text-[10px] font-bold text-[#1F7068] uppercase bg-white border border-slate-200 px-2 py-0.5 rounded">ホルベイン</span>
                            <h3 id="detectedName" class="font-black text-slate-800 text-sm mt-1">ホルベイン油絵具 W-195 シルバーホワイト 6号(20ml)</h3>
                            <p id="detectedJan" class="text-xs text-slate-400 font-mono mt-0.5">JAN: 4938766001952</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-slate-200/80">
                        <label class="text-xs font-bold text-slate-600">残量ステータス:</label>
                        <select id="detectedStatus" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold text-slate-700">
                            <option value="new">🟢 新品（未開封）</option>
                            <option value="using" selected>🟡 使用中（半分以上）</option>
                            <option value="low">🟠 残りわずか（要買足し）</option>
                        </select>
                    </div>

                    <button onclick="confirmAddToStock()" class="w-full bg-[#F0A732] hover:bg-[#D99222] text-white font-black text-xs py-2.5 rounded-xl shadow-md flex items-center justify-center gap-1.5 transition active:scale-95">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span>マイパレットに登録する</span>
                    </button>
                </div>

            </div>
        </section>

        <!-- タブ3: お買い物リスト（Buy List） -->
        <section id="viewBuy" class="hidden flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="font-black text-slate-800 text-base">画材屋お買い物リスト</h2>
                    <p class="text-xs text-slate-400">「残りわずか」「空」の画材が自動でここに入ります</p>
                </div>
                <span id="buyListBadge" class="bg-red-50 text-red-600 border border-red-200 font-black text-xs px-2.5 py-1 rounded-full">0点</span>
            </div>

            <div id="buyListContainer" class="flex flex-col gap-2.5">
                <!-- 動的レンダリング -->
            </div>
        </section>

    </main>

    <!-- 下部タブバー（iOSスタイル） -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-40 max-w-2xl mx-auto flex justify-around py-2 px-4 shadow-lg">
        <button onclick="switchTab('palette')" id="navPalette" class="flex flex-col items-center gap-1 text-[#1F7068] font-bold text-[10px] transition">
            <i data-lucide="palette" class="w-5 h-5"></i>
            <span>マイパレット</span>
        </button>
        <button onclick="switchTab('scan')" id="navScan" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-[10px] transition">
            <i data-lucide="scan-barcode" class="w-5 h-5"></i>
            <span>バーコード読取</span>
        </button>
        <button onclick="switchTab('buy')" id="navBuy" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-[10px] transition relative">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span>買い物リスト</span>
            <span id="navBuyDot" class="hidden absolute top-0 right-2 w-2 h-2 rounded-full bg-red-500"></span>
        </button>
    </nav>

    <!-- アプリケーションロジック -->
    <script>
        // サンプルマスターデータ（JANコード連動辞書）
        const CATALOG_SAMPLE = [
            { jan: "4938766001952", brand: "ホルベイン", name: "ホルベイン油絵具 W-195 シルバー ホワイト 6号(20ml)", category: "油絵具", color: "#E2E8F0" },
            { jan: "4938766000016", brand: "ホルベイン", name: "ホルベイン油絵具 H-001 クリムソン レーキ 6号(20ml)", category: "油絵具", color: "#C53030" },
            { jan: "4938766000214", brand: "ホルベイン", name: "ホルベイン油絵具 H-021 コバルト ブルー 6号(20ml)", category: "油絵具", color: "#2B6CB0" },
            { jan: "4938766000450", brand: "ホルベイン", name: "ホルベイン油絵具 H-045 パーマネント イエロー 6号(20ml)", category: "油絵具", color: "#D69E2E" },
            { jan: "4938766000726", brand: "ホルベイン", name: "ホルベイン油絵具 H-072 ビリジャン 6号(20ml)", category: "油絵具", color: "#1F7068" },
            { jan: "4938766001112", brand: "ホルベイン", name: "ホルベイン油絵具 H-111 バーント アンバー 6号(20ml)", category: "油絵具", color: "#744210" },
            { jan: "4901881180210", brand: "クサカベ", name: "クサカベ テレピン 250ml (揮発性油)", category: "画溶液", color: "#EBF8FF" },
            { jan: "4938766012101", brand: "ホルベイン", name: "ホルベイン 油彩筆 特殊豚毛 フィルバート No.8", category: "筆", color: "#4A5568" }
        ];

        // ユーザーの手持ち画材（localStorage永続化）
        let userStock = JSON.parse(localStorage.getItem('artstock_items') || 'null');
        if (!userStock) {
            userStock = [
                { id: 1, jan: "4938766001952", brand: "ホルベイン", name: "ホルベイン油絵具 W-195 シルバー ホワイト 6号(20ml)", category: "油絵具", status: "low", color: "#E2E8F0" },
                { id: 2, jan: "4938766000214", brand: "ホルベイン", name: "ホルベイン油絵具 H-021 コバルト ブルー 6号(20ml)", category: "油絵具", status: "using", color: "#2B6CB0" },
                { id: 3, jan: "4901881180210", brand: "クサカベ", name: "クサカベ テレピン 250ml", category: "画溶液", status: "new", color: "#EBF8FF" }
            ];
            saveStock();
        }

        let pendingItem = null;

        function saveStock() {
            localStorage.setItem('artstock_items', JSON.stringify(userStock));
        }

        function switchTab(tab) {
            ['viewPalette', 'viewScan', 'viewBuy'].forEach(id => document.getElementById(id).classList.add('hidden'));
            ['navPalette', 'navScan', 'navBuy'].forEach(id => {
                const el = document.getElementById(id);
                el.className = 'flex flex-col items-center gap-1 text-slate-400 font-medium text-[10px] transition';
            });

            if (tab === 'palette') {
                document.getElementById('viewPalette').classList.remove('hidden');
                document.getElementById('navPalette').className = 'flex flex-col items-center gap-1 text-[#1F7068] font-bold text-[10px] transition';
                renderStockList();
            } else if (tab === 'scan') {
                document.getElementById('viewScan').classList.remove('hidden');
                document.getElementById('navScan').className = 'flex flex-col items-center gap-1 text-[#1F7068] font-bold text-[10px] transition';
            } else if (tab === 'buy') {
                document.getElementById('viewBuy').classList.remove('hidden');
                document.getElementById('navBuy').className = 'flex flex-col items-center gap-1 text-[#1F7068] font-bold text-[10px] transition';
                renderBuyList();
            }

            lucide.createIcons();
        }

        function renderStockList() {
            const container = document.getElementById('stockListContainer');
            const cat = document.getElementById('filterCategory').value;
            container.innerHTML = '';

            const filtered = userStock.filter(item => cat === 'all' || item.category === cat);
            document.getElementById('totalStockCount').innerText = userStock.length;

            updateBuyBadge();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
                        <p class="text-xs">登録された画材がありません。<br>「バーコード読取」からスキャンしてください。</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-2.5";
                div.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div class="flex items-start gap-2.5">
                            <span class="w-3.5 h-3.5 rounded-full mt-1 border border-slate-300 shrink-0" style="background:${item.color || '#CBD5E1'}"></span>
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${item.brand} ・ ${item.category}</span>
                                <h3 class="font-bold text-slate-800 text-sm leading-snug">${item.name}</h3>
                                <p class="text-[11px] text-slate-400 font-mono">JAN: ${item.jan}</p>
                            </div>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-slate-300 hover:text-red-500 transition p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs">
                        <span class="text-slate-400 font-medium text-[11px]">残量:</span>
                        <div class="flex gap-1">
                            <button onclick="updateStatus(${item.id}, 'new')" class="px-2 py-0.5 rounded text-[11px] font-bold ${item.status === 'new' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-slate-100 text-slate-500'}">新品</button>
                            <button onclick="updateStatus(${item.id}, 'using')" class="px-2 py-0.5 rounded text-[11px] font-bold ${item.status === 'using' ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-slate-100 text-slate-500'}">使用中</button>
                            <button onclick="updateStatus(${item.id}, 'low')" class="px-2 py-0.5 rounded text-[11px] font-bold ${item.status === 'low' ? 'bg-red-100 text-red-800 border border-red-300' : 'bg-slate-100 text-slate-500'}">残りわずか</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            lucide.createIcons();
        }

        function updateStatus(id, newStatus) {
            const item = userStock.find(i => i.id === id);
            if (item) {
                item.status = newStatus;
                saveStock();
                renderStockList();
            }
        }

        function deleteItem(id) {
            if (confirm("この画材を手持ちリストから削除しますか？")) {
                userStock = userStock.filter(i => i.id !== id);
                saveStock();
                renderStockList();
            }
        }

        function updateBuyBadge() {
            const lowItems = userStock.filter(i => i.status === 'low');
            document.getElementById('buyListBadge').innerText = `${lowItems.length} 点`;
            const dot = document.getElementById('navBuyDot');
            if (lowItems.length > 0) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }

        function renderBuyList() {
            const container = document.getElementById('buyListContainer');
            container.innerHTML = '';
            const lowItems = userStock.filter(i => i.status === 'low');

            if (lowItems.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400">
                        <i data-lucide="check-circle" class="w-8 h-8 mx-auto mb-2 text-emerald-500"></i>
                        <p class="text-xs font-bold text-slate-700">補充が必要な画材はありません！</p>
                        <p class="text-[11px] text-slate-400 mt-1">「残りわずか」になった画材がここに自動で表示されます。</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            lowItems.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border border-red-200 shadow-sm flex justify-between items-center gap-3";
                div.innerHTML = `
                    <div>
                        <span class="text-[10px] font-black text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded">要補充</span>
                        <h3 class="font-bold text-slate-800 text-sm mt-1">${item.name}</h3>
                        <p class="text-[11px] text-slate-400 font-mono">JAN: ${item.jan}</p>
                    </div>
                    <button onclick="updateStatus(${item.id}, 'new'); renderBuyList();" class="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-2 rounded-xl shadow-sm flex items-center gap-1 transition">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                        <span>購入完了</span>
                    </button>
                `;
                container.appendChild(div);
            });

            lucide.createIcons();
        }

        // バーコードスキャンシミュレーション
        function simulateCameraScan() {
            // ランダムにカタログから1つピックアップ
            const sample = CATALOG_SAMPLE[Math.floor(Math.random() * CATALOG_SAMPLE.length)];
            showDetectedCard(sample);
        }

        function searchAndAdd() {
            const query = document.getElementById('scanInput').value.trim();
            if (!query) return;

            const found = CATALOG_SAMPLE.find(c => c.jan.includes(query) || c.name.includes(query));
            if (found) {
                showDetectedCard(found);
            } else {
                alert("該当する画材が見つかりませんでした。手動登録モードへ移行します。");
            }
        }

        function showDetectedCard(item) {
            pendingItem = item;
            document.getElementById('detectedBrand').innerText = item.brand;
            document.getElementById('detectedName').innerText = item.name;
            document.getElementById('detectedJan').innerText = `JAN: ${item.jan}`;
            document.getElementById('scannedResultCard').classList.remove('hidden');
            lucide.createIcons();
        }

        function confirmAddToStock() {
            if (!pendingItem) return;
            const status = document.getElementById('detectedStatus').value;

            userStock.push({
                id: Date.now(),
                jan: pendingItem.jan,
                brand: pendingItem.brand,
                name: pendingItem.name,
                category: pendingItem.category,
                status: status,
                color: pendingItem.color
            });

            saveStock();
            alert(`「${pendingItem.name}」をマイパレットに登録しました！`);
            document.getElementById('scannedResultCard').classList.add('hidden');
            document.getElementById('scanInput').value = '';
            pendingItem = null;
            switchTab('palette');
        }

        window.addEventListener('load', () => {
            renderStockList();
            lucide.createIcons();
        });
    </script>
</body>
</html>
