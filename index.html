<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笹部画材 3,000円ガチャ＆ルーレット</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-rose-600 to-orange-500 text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-6 flex flex-wrap justify-between items-center gap-4">
            <div>
                <span class="text-xs font-semibold uppercase tracking-wider bg-white/20 px-2.5 py-1 rounded-full text-rose-100">非公式ファンツール</span>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight mt-1">笹部画材 3,000円ガチャ 🎨</h1>
            </div>
            <a href="https://www.sasabegazai.co.jp/" target="_blank" rel="noopener noreferrer" class="text-xs md:text-sm bg-white/10 hover:bg-white/20 transition px-3 py-1.5 rounded-lg border border-white/20 flex items-center gap-1">
                公式サイトを開く <i data-lucide="external-link" class="w-4 h-4"></i>
            </a>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- コントロールエリア -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">ターゲット予算</label>
                    <div class="relative">
                        <input type="number" id="budgetInput" value="3000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 pr-12">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-slate-400">円</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">モード選択</label>
                    <select id="modeSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500">
                        <option value="budget">予算ギリギリ詰め合わせ</option>
                        <option value="single">運試し！ぴったり単品狙い</option>
                        <option value="3items">ちょうど3点チョイス</option>
                    </select>
                </div>

                <div>
                    <button id="spinBtn" onclick="spinGacha()" class="w-full bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 active:scale-95 transition-all duration-150 text-white font-black text-lg py-3.5 px-6 rounded-xl shadow-md shadow-rose-200 flex items-center justify-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> ガチャを回す！
                    </button>
                </div>
            </div>
        </div>

        <!-- ルーレット演出エリア -->
        <div id="rouletteDisplay" class="hidden bg-slate-900 text-white rounded-2xl p-8 mb-8 text-center shadow-xl relative overflow-hidden">
            <p class="text-rose-400 font-bold text-sm tracking-widest uppercase mb-2">チョイス中...</p>
            <div id="slotItem" class="text-2xl md:text-3xl font-black min-h-[48px] flex items-center justify-center text-slate-200">
                Supabaseから画材を選定しています...
            </div>
        </div>

        <!-- 結果表示エリア -->
        <div id="resultContainer" class="hidden space-y-6">
            <div class="bg-gradient-to-br from-rose-50 to-orange-50 rounded-2xl p-6 border border-rose-100 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <span class="text-xs font-bold text-rose-500 uppercase tracking-wider">合計金額</span>
                    <div class="text-3xl md:text-4xl font-black text-slate-900">
                        <span id="totalPrice">0</span> <span class="text-xl font-bold text-slate-600">円</span>
                    </div>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">予算差額</span>
                    <div id="budgetDiff" class="text-lg font-bold text-emerald-600">
                        -0 円
                    </div>
                </div>
                <button onclick="spinGacha()" class="bg-white hover:bg-slate-50 text-slate-700 font-bold px-4 py-2 rounded-lg border border-slate-200 text-sm shadow-sm flex items-center gap-1.5">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i> もう一度回す
                </button>
            </div>

            <!-- 当たった商品リスト（商品ページへのリンク付き） -->
            <div id="itemList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- JSで動的生成 -->
            </div>
        </div>

        <!-- データ管理・ステータス領域 -->
        <div class="mt-12 border-t border-slate-200 pt-8">
            <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
                <div class="font-bold text-slate-700 flex justify-between items-center">
                    <span class="flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 text-slate-400"></i> Supabaseデータ連携ステータス</span>
                    <button onclick="loadProductsFromSupabase()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition font-bold text-slate-600">再読み込み</button>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-100 text-sm space-y-2">
                    <p class="text-slate-500">
                        Supabase接続済み商品件数: <strong id="itemCount" class="text-slate-800">読み込み中...</strong> 件
                    </p>
                    <p class="text-xs text-slate-400">※GitHub Actionsの自動スクレイピングによってSupabaseに蓄積された最新データからガチャが回ります。</p>
                </div>
            </div>
        </div>

    </main>

    <!-- バナー広告枠（サンプル） -->
    <div class="max-w-4xl mx-auto px-4 my-4 w-full text-center">
        <div class="bg-slate-200/60 border border-dashed border-slate-300 rounded-xl py-4 px-2 text-xs text-slate-400 font-medium">
            スポンサーリンク / 広告掲載スペース
        </div>
    </div>

    <!-- フッター -->
    <footer class="bg-slate-100 border-t border-slate-200 py-6 text-center text-xs text-slate-400">
        <div class="max-w-4xl mx-auto px-4">
            <p>当アプリは笹部画材様の非公式ファン制作ツールです。</p>
            <p class="mt-1">© 3,000 yen Art Supplies Gacha App</p>
        </div>
    </footer>

    <!-- アプリケーションロジック & Supabase連携 -->
    <script>
        // Supabase の設定（ご自身のプロジェクトURLとAnonキーに書き換えてください）
        const SUPABASE_URL = 'あなたのSUPABASE_URL';
        const SUPABASE_ANON_KEY = 'あなたのSUPABASE_ANON_KEY';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let items = [];

        // 起動時にSupabaseから商品データを取得
        async function loadProductsFromSupabase() {
            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) {
                    console.error(error);
                    document.getElementById('itemCount').innerText = 'エラー (取得失敗)';
                    return;
                }
                items = data || [];
                document.getElementById('itemCount').innerText = items.length;
                if (items.length === 0) {
                    alert('Supabaseに商品データがありません。スクレイピングを実行してください。');
                }
            } catch (e) {
                console.error(e);
                document.getElementById('itemCount').innerText = '接続エラー';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            loadProductsFromSupabase();
        });

        async function spinGacha() {
            if (items.length === 0) {
                alert('商品データが読み込まれていません。');
                await loadProductsFromSupabase();
                if (items.length === 0) return;
            }

            const budget = parseInt(document.getElementById('budgetInput').value) || 3000;
            const mode = document.getElementById('modeSelect').value;

            const rouletteDisplay = document.getElementById('rouletteDisplay');
            const slotItem = document.getElementById('slotItem');
            const resultContainer = document.getElementById('resultContainer');
            const spinBtn = document.getElementById('spinBtn');

            spinBtn.disabled = true;
            resultContainer.classList.add('hidden');
            rouletteDisplay.classList.remove('hidden');

            // スロット高速切り替え演出
            let counter = 0;
            const interval = setInterval(() => {
                const randomSample = items[Math.floor(Math.random() * items.length)];
                slotItem.innerText = `${randomSample.name} (¥${randomSample.price.toLocaleString()})`;
                counter++;
            }, 80);

            // 1.5秒後に結果決定
            setTimeout(() => {
                clearInterval(interval);
                rouletteDisplay.classList.add('hidden');
                spinBtn.disabled = false;

                const selectedItems = calculateResult(budget, mode);
                renderResult(selectedItems, budget);

                // 紙吹雪演出
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 }
                });

            }, 1500);
        }

        function calculateResult(budget, mode) {
            let shuffled = [...items].sort(() => 0.5 - Math.random());
            let selected = [];
            let currentTotal = 0;

            if (mode === 'budget') {
                for (let item of shuffled) {
                    if (currentTotal + item.price <= budget) {
                        selected.push(item);
                        currentTotal += item.price;
                    }
                }
            } else if (mode === 'single') {
                let affordable = items.filter(i => i.price <= budget);
                if (affordable.length > 0) {
                    selected.push(affordable[Math.floor(Math.random() * affordable.length)]);
                }
            } else if (mode === '3items') {
                for (let item of shuffled) {
                    if (selected.length < 3 && currentTotal + item.price <= budget) {
                        selected.push(item);
                        currentTotal += item.price;
                    }
                }
            }
            return selected;
        }

        function renderResult(selectedItems, budget) {
            const resultContainer = document.getElementById('resultContainer');
            const itemList = document.getElementById('itemList');
            const totalPriceEl = document.getElementById('totalPrice');
            const budgetDiffEl = document.getElementById('budgetDiff');

            itemList.innerHTML = '';
            let total = 0;

            if (selectedItems.length === 0) {
                itemList.innerHTML = '<p class="col-span-2 text-center text-slate-400 py-4">条件に合う商品が見つかりませんでした。</p>';
            }

            selectedItems.forEach(item => {
                total += item.price;
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col justify-between gap-3";
                
                // アフィリエイト/商品ページへのリンクボタンをカード内に設置
                card.innerHTML = `
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">${item.category || '画材'}</span>
                        <h4 class="font-bold text-slate-800 text-sm md:text-base">${item.name}</h4>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-50">
                        <span class="font-black text-rose-500 text-base md:text-lg">¥${item.price.toLocaleString()}</span>
                        ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-xs bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">商品を見る <i data-lucide="external-link" class="w-3 h-3"></i></a>` : ''}
                    </div>
                `;
                itemList.appendChild(card);
            });

            totalPriceEl.innerText = total.toLocaleString();
            const diff = budget - total;
            budgetDiffEl.innerText = `おつり: ${diff.toLocaleString()} 円`;

            resultContainer.classList.remove('hidden');
            lucide.createIcons(); // アイコンを再描画
        }
    </script>
</body>
</html>
