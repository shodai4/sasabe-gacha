    <!-- アプリケーション ロジック -->
    <script>
        // ==========================================
        // 設定 & 定数 (config.jsから読み込み)
        // ==========================================
        const CFG = window.APP_CONFIG || {};
        const SUPABASE_URL = CFG.SUPABASE_URL || "";
        const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || "";

        const CACHE_KEY = "sasabe_gacha_products_v4";
        const CACHE_EXPIRE_KEY = "sasabe_gacha_expire_v4";
        const CACHE_TTL_MS = CFG.CACHE_TTL_MS || (6 * 60 * 60 * 1000); // 6時間

        let _supabase = null;
        try {
            if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes("xxxx")) {
                _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase initialization failed:', e);
        }

        let items = [];

        // XSS防止用エスケープ関数
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 安全なリンク検証・整形（相対パスなら笹部画材ドメインを自動補完）
        function sanitizeUrl(rawUrl) {
            if (!rawUrl) return '';
            let u = String(rawUrl).trim();
            if (u.startsWith('//')) {
                u = 'https:' + u;
            } else if (!u.startsWith('http://') && !u.startsWith('https://')) {
                u = 'https://www.sasabegazai.co.jp/' + u.replace(/^\/+/, '');
            }
            if (u.startsWith('https://www.sasabegazai.co.jp/') || 
                u.startsWith('http://www.sasabegazai.co.jp/')) {
                return escapeHtml(u);
            }
            return '';
        }

        // ==========================================
        // カテゴリー動的同期（DBのcategory列の値をそのままプルダウンに反映）
        // ==========================================
        function updateCategorySelect() {
            const selectEl = document.getElementById('categorySelect');
            if (!selectEl || !items || items.length === 0) return;

            const previousValue = selectEl.value;

            // DB内のユニークなカテゴリを抽出して出現数を集計
            const counts = {};
            items.forEach(it => {
                const c = (it.category || '').trim();
                if (c) counts[c] = (counts[c] || 0) + 1;
            });

            // 笹部画材サイトの標準的な並び順（サイトの順番）
            const SITE_CATEGORY_ORDER = [
                '油絵具・ピグメント',
                '画溶液・クリーナー',
                'アクリル絵具',
                'キャンバス・木枠・パネル',
                '油彩・アクリル用品',
                '筆・刷毛',
                '紙・ブック・紙携帯用品',
                '水彩・インク・ペン',
                '顔彩・書道・水墨・篆刻',
                'パステル・コンテ・色鉛筆',
                'デッサン用品',
                '製図・模型',
                'エッチング・木版画材料',
                'ホビー・ねんど・染色',
                '額縁・仮額',
                'オリジナル商品'
            ];

            const categories = Object.keys(counts).sort((a, b) => {
                const idxA = SITE_CATEGORY_ORDER.indexOf(a);
                const idxB = SITE_CATEGORY_ORDER.indexOf(b);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return counts[b] - counts[a];
            });

            selectEl.innerHTML = `<option value="all">🎨 すべてのカテゴリー (${items.length.toLocaleString()}点)</option>`;
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `📁 ${cat} (${counts[cat].toLocaleString()}点)`;
                selectEl.appendChild(opt);
            });

            // 以前選択されていた値が存在すれば復元
            if (previousValue && (previousValue === 'all' || counts[previousValue])) {
                selectEl.value = previousValue;
            }
        }

        function matchesCategory(item, categoryKey) {
            if (!categoryKey || categoryKey === 'all') return true;
            return (item.category || '').trim() === categoryKey;
        }

        // ==========================================
        // 商品データ読み込み（Supabase ＆ キャッシュ ＆ フォールバック）
        // ==========================================
        async function loadProducts() {
            const countEl = document.getElementById('itemCount');
            
            // 1. セッションキャッシュの確認
            try {
                const cached = sessionStorage.getItem(CACHE_KEY);
                const expire = sessionStorage.getItem(CACHE_EXPIRE_KEY);
                if (cached && expire && Date.now() < parseInt(expire, 10)) {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        if (Array.isArray(parsed[0])) {
                            items = parsed.map(([name, price, category, url]) => ({ name, price, category, url }));
                        } else {
                            items = parsed;
                        }
                        countEl.innerText = `${items.length.toLocaleString()} (キャッシュ)`;
                        updateCategorySelect();
                        return;
                    }
                }
            } catch (e) {
                console.warn('Cache read error:', e);
            }

            // 2. Supabaseからの全件取得（1,000件上限をページネーションで突破）
            if (_supabase) {
                try {
                    countEl.innerText = 'Supabaseから全商品を取得中...';
                    
                    const PAGE_SIZE = 1000;
                    // 初回リクエストで件数と最初の1,000件を取得
                    const { data: firstPage, count, error: firstErr } = await _supabase
                        .from('products')
                        .select('name, price, category, url', { count: 'exact' })
                        .eq('in_stock', true)
                        .range(0, PAGE_SIZE - 1);

                    if (firstErr) throw firstErr;

                    let allData = firstPage || [];
                    const totalCount = count || allData.length;

                    if (totalCount > PAGE_SIZE) {
                        const totalPages = Math.ceil(totalCount / PAGE_SIZE);
                        const pagePromises = [];
                        for (let p = 1; p < totalPages; p++) {
                            const from = p * PAGE_SIZE;
                            const to = Math.min((p + 1) * PAGE_SIZE - 1, totalCount - 1);
                            pagePromises.push(
                                _supabase
                                    .from('products')
                                    .select('name, price, category, url')
                                    .eq('in_stock', true)
                                    .range(from, to)
                            );
                        }
                        const results = await Promise.all(pagePromises);
                        for (const res of results) {
                            if (res.data) {
                                allData = allData.concat(res.data);
                            }
                        }
                    }

                    if (allData.length > 0) {
                        items = allData;
                        try {
                            const compact = items.map(i => [i.name, i.price, i.category, i.url]);
                            sessionStorage.setItem(CACHE_KEY, JSON.stringify(compact));
                            sessionStorage.setItem(CACHE_EXPIRE_KEY, String(Date.now() + CACHE_TTL_MS));
                        } catch (quotaError) {
                            console.warn('SessionStorage full:', quotaError);
                        }
                        countEl.innerText = items.length.toLocaleString();
                        updateCategorySelect();
                        return;
                    } else {
                        console.warn('Supabase returned 0 products.');
                    }
                } catch (err) {
                    console.error('Supabase fetch error:', err);
                    countEl.innerText = '接続エラー';
                }
            }

            // 3. フォールバック（オフライン・デモ用サンプルデータ）
            if (items.length === 0) {
                items = [
                    { name: "クサカベ油絵具 20ml チタニウムホワイト", price: 420, category: "油絵具・ピグメント", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1101" },
                    { name: "ホルベイン 油絵具 20ml ウルトラマリンディープ", price: 550, category: "油絵具・ピグメント", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1102" },
                    { name: "ホルベイン ヴェルネ 20ml コバルトブルー", price: 1980, category: "油絵具・ピグメント", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1107" },
                    { name: "クサカベ テレピン 55ml", price: 680, category: "画溶液・クリーナー", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1202" },
                    { name: "リキテックス プライム アクリル絵具 24色セット", price: 8250, category: "アクリル絵具", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1301" },
                    { name: "クレサン 張りキャンバス F4号", price: 850, category: "キャンバス・木枠・パネル", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1401" },
                    { name: "ホルベイン ペインティングナイフ No.1", price: 1100, category: "油彩・アクリル用品", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1503" },
                    { name: "ナムラ 油彩筆 SK 8号 丸", price: 920, category: "筆・刷毛", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1603" },
                    { name: "ウォーターフォード水彩紙 ホワイト ブロック 300g F8", price: 4950, category: "紙・ブック・紙携帯用品", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1701" },
                    { name: "ホルベイン 透明水彩絵具 24色セット", price: 4620, category: "水彩・インク・ペン", url: "https://www.sasabegazai.co.jp/listview/item.html?id=1801" },
                    { name: "カランダッシュ ネオパステル 96色木箱セット", price: 52800, category: "パステル・コンテ・色鉛筆", url: "https://www.sasabegazai.co.jp/listview/item.html?id=2001" },
                    { name: "高級ゴールド油彩額縁 F30号 彫刻入り", price: 48900, category: "額縁・仮額", url: "https://www.sasabegazai.co.jp/listview/item.html?id=2501" }
                ];
                countEl.innerText = `${items.length} (デモサンプルモード)`;
                updateCategorySelect();
            }
        }

        function refreshData() {
            sessionStorage.removeItem(CACHE_KEY);
            sessionStorage.removeItem(CACHE_EXPIRE_KEY);
            loadProducts();
        }

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            loadProducts();
        });

        // ==========================================
        // ガチャ実行
        // ==========================================
        async function spinGacha() {
            if (items.length === 0) {
                await loadProducts();
                if (items.length === 0) {
                    alert('商品データがありません。');
                    return;
                }
            }

            let rawBudget = parseInt(document.getElementById('budgetInput').value, 10);
            if (isNaN(rawBudget) || rawBudget <= 0) rawBudget = 3000;
            if (rawBudget > 10000000) rawBudget = 10000000;
            const budget = rawBudget;
            document.getElementById('budgetInput').value = budget;

            const mode = document.getElementById('modeSelect').value;
            const categoryKey = document.getElementById('categorySelect').value;
            const rouletteDisplay = document.getElementById('rouletteDisplay');
            const slotItem = document.getElementById('slotItem');
            const resultContainer = document.getElementById('resultContainer');
            const spinBtn = document.getElementById('spinBtn');

            spinBtn.disabled = true;
            resultContainer.classList.add('hidden');
            rouletteDisplay.classList.remove('hidden');

            const categoryPool = items.filter(i => matchesCategory(i, categoryKey));
            const samplePool = categoryPool.length > 0 ? categoryPool : items;

            const interval = setInterval(() => {
                const randomSample = samplePool[Math.floor(Math.random() * samplePool.length)];
                slotItem.textContent = `${randomSample.name} (¥${Number(randomSample.price).toLocaleString()})`;
            }, 70);

            setTimeout(() => {
                clearInterval(interval);
                rouletteDisplay.classList.add('hidden');
                spinBtn.disabled = false;

                const result = calculateResult(budget, mode, categoryKey);
                renderResult(result.items, budget, result.notice);

                try {
                    confetti({
                        particleCount: budget >= 100000 ? 120 : 50,
                        spread: budget >= 100000 ? 90 : 60,
                        origin: { y: 0.7 }
                    });
                } catch(e) {}
            }, 1100);
        }

        // ==========================================
        // ガチャ計算ロジック（おつり最小化 ＆ 最大99点対応）
        // ==========================================
        function calculateResult(budget, mode, categoryKey) {
            if (!items || items.length === 0) return { items: [], notice: '' };

            let pool = items.filter(i => matchesCategory(i, categoryKey));
            let notice = '';

            if (pool.length === 0) {
                pool = items;
                notice = '※指定されたカテゴリーに該当する商品がなかったため、全商品から選定しました。';
            }

            // 1. ピッタリ単品狙い（おつりを少なく、ランダム性も残す）
            if (mode === 'single') {
                const affordable = pool.filter(i => Number(i.price) <= budget);
                if (affordable.length === 0) {
                    const cheapest = [...pool].sort((a, b) => Number(a.price) - Number(b.price))[0];
                    return { 
                        items: [cheapest], 
                        notice: `※予算（¥${budget.toLocaleString()}）以内の単品がなかったため、最安商品（¥${Number(cheapest.price).toLocaleString()}）を表示しています。` 
                    };
                }

                affordable.sort((a, b) => Number(b.price) - Number(a.price));
                const maxPrice = Number(affordable[0].price);

                if (budget >= maxPrice * 1.5) {
                    notice = `💡 単品の最高額商品（¥${maxPrice.toLocaleString()}）を選出しました。${budget.toLocaleString()}円を満額使い切るには「🛒 予算ギリギリ詰め合わせ」モードをお試しください！`;
                    return { items: [affordable[0]], notice };
                }

                const highTier = affordable.filter(i => Number(i.price) >= budget * 0.75);
                if (highTier.length >= 3) {
                    return { items: [highTier[Math.floor(Math.random() * highTier.length)]], notice };
                } else if (affordable.length >= 10) {
                    const topCandidates = affordable.slice(0, 10);
                    return { items: [topCandidates[Math.floor(Math.random() * topCandidates.length)]], notice };
                } else {
                    return { items: [affordable[Math.floor(Math.random() * affordable.length)]], notice };
                }
            }

            // 2. ちょうど3点チョイス（おつりを少なく、ランダム性も残す）
            if (mode === '3items') {
                const affordable = pool.filter(i => Number(i.price) <= budget);
                if (affordable.length < 3) return { items: affordable.slice(0, 3), notice };

                const combinations = [];
                for (let iter = 0; iter < 120; iter++) {
                    const shuffled = [...affordable].sort(() => 0.5 - Math.random());
                    const sample = [];
                    let sum = 0;
                    for (let item of shuffled) {
                        const p = Number(item.price);
                        if (sample.length < 3 && sum + p <= budget) {
                            sample.push(item);
                            sum += p;
                        }
                    }
                    if (sample.length === 3) {
                        combinations.push({ items: sample, total: sum, diff: budget - sum });
                    }
                }

                if (combinations.length > 0) {
                    combinations.sort((a, b) => a.diff - b.diff);
                    const minDiff = combinations[0].diff;
                    if (minDiff > budget * 0.4) {
                        notice = `💡 3点チョイスの最高合計金額を選出しました。${budget.toLocaleString()}円を余さず使い切るには「🛒 予算ギリギリ詰め合わせ」モードが最適です！`;
                    }
                    const topGroup = combinations.filter(c => c.diff <= Math.max(minDiff + budget * 0.1, minDiff + 200));
                    const picked = topGroup[Math.floor(Math.random() * Math.min(topGroup.length, 8))];
                    return { items: picked.items, notice };
                }

                return { items: affordable.slice(0, 3), notice };
            }

            // 3. 予算ギリギリ詰め合わせ（最大99点対応）
            if (mode === 'budget') {
                const affordable = pool.filter(i => Number(i.price) <= budget);
                if (affordable.length === 0) return { items: [], notice };

                const MAX_ITEMS = 99;
                const selected = [];
                let currentTotal = 0;

                let candidates;
                if (budget >= 100000) {
                    const targetAvg = budget / Math.min(MAX_ITEMS, Math.max(10, Math.floor(budget / 10000)));
                    candidates = [...affordable].sort((a, b) => {
                        const scoreA = Math.abs(Number(a.price) - targetAvg) * (0.4 + Math.random() * 1.2);
                        const scoreB = Math.abs(Number(b.price) - targetAvg) * (0.4 + Math.random() * 1.2);
                        return scoreA - scoreB;
                    });
                } else {
                    candidates = [...affordable].sort(() => 0.5 - Math.random());
                }

                for (let it of candidates) {
                    if (selected.length >= MAX_ITEMS) break;
                    const p = Number(it.price);
                    if (currentTotal + p <= budget) {
                        selected.push(it);
                        currentTotal += p;
                    }
                }

                let remaining = budget - currentTotal;
                if (remaining > 0 && selected.length < MAX_ITEMS) {
                    const fillers = affordable
                        .filter(i => Number(i.price) <= remaining && !selected.some(s => s.name === i.name))
                        .sort((a, b) => Number(b.price) - Number(a.price));

                    for (let it of fillers) {
                        if (selected.length >= MAX_ITEMS) break;
                        const p = Number(it.price);
                        if (currentTotal + p <= budget) {
                            selected.push(it);
                            currentTotal += p;
                            if (budget - currentTotal === 0) break;
                        }
                    }
                }

                return { items: selected, notice };
            }

            return { items: [], notice: '' };
        }

        // ==========================================
        // 結果描画
        // ==========================================
        function renderResult(selectedItems, budget, noticeText) {
            const resultContainer = document.getElementById('resultContainer');
            const itemList = document.getElementById('itemList');
            const totalPriceEl = document.getElementById('totalPrice');
            const budgetDiffEl = document.getElementById('budgetDiff');
            const itemCountDisplay = document.getElementById('itemCountDisplay');
            const resultNotice = document.getElementById('resultNotice');

            itemList.innerHTML = '';
            let total = 0;

            if (selectedItems.length === 0) {
                itemList.innerHTML = '<p class="col-span-2 text-center text-slate-400 py-6 font-medium">条件に合う商品が見つかりませんでした。予算を増やして再度お試しください。</p>';
            }

            selectedItems.forEach(item => {
                const price = Number(item.price) || 0;
                total += price;

                const safeName = escapeHtml(item.name);
                const safeCategory = escapeHtml(item.category || '画材');
                const safeUrl = sanitizeUrl(item.url);

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-[#2BB3A3]/20 shadow-sm flex flex-col justify-between gap-3 hover:shadow-md hover:border-[#2BB3A3]/50 transition";
                
                const linkButton = safeUrl ? `
                    <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="text-xs bg-[#1F7068] hover:bg-[#16524C] text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                        商品を見る <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                ` : '';

                card.innerHTML = `
                    <div>
                        <span class="text-[10px] font-bold text-[#3BA29B] uppercase tracking-wider block mb-1">${safeCategory}</span>
                        <h4 class="font-bold text-slate-800 text-sm md:text-base leading-snug">${safeName}</h4>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-50">
                        <span class="font-black text-[#1F7068] text-base md:text-lg">¥${price.toLocaleString()}</span>
                        ${linkButton}
                    </div>
                `;
                itemList.appendChild(card);
            });

            totalPriceEl.textContent = total.toLocaleString();
            const diff = budget - total;
            budgetDiffEl.textContent = `おつり: ${diff.toLocaleString()} 円`;

            if (noticeText) {
                resultNotice.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-amber-600 flex-shrink-0"></i> <span>${escapeHtml(noticeText)}</span>`;
                resultNotice.classList.remove('hidden');
            } else {
                resultNotice.classList.add('hidden');
            }

            resultContainer.classList.remove('hidden');
            lucide.createIcons();
        }

        // ==========================================
        // SNSシェア機能
        // ==========================================
        function getShareText() {
            const total = document.getElementById('totalPrice').textContent;
            const budget = document.getElementById('budgetInput').value;
            const diff = document.getElementById('budgetDiff').textContent.replace('おつり: ', '').trim();
            const categorySelect = document.getElementById('categorySelect');
            const categoryLabel = categorySelect.options[categorySelect.selectedIndex]?.text?.replace(/^[^\s]+\s*/, '')?.replace(/\s*\([\d,]+点\)$/, '') || '';
            
            const catPart = categorySelect.value !== 'all' ? `（${categoryLabel}限定）` : '';
            return `🎨 笹部画材で【予算${Number(budget).toLocaleString()}円${catPart}】ガチャを回しました！\n合計: ¥${total}（おつり: ${diff}）\n\n笹部画材 3,000円ガチャ＆ルーレット\n#笹部画材 #画材ガチャ #笹部画材ガチャ`;
        }

        function shareOnX() {
            const text = getShareText();
            const url = window.location.href;
            const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
            window.open(shareUrl, '_blank', 'noopener,noreferrer');
        }

        function shareOnLine() {
            const text = getShareText();
            const url = window.location.href;
            const shareUrl = `https://line.me/R/msg/text/?${encodeURIComponent(text + '\n' + url)}`;
            window.open(shareUrl, '_blank', 'noopener,noreferrer');
        }

        async function copyResult() {
            const copyBtn = document.getElementById('copyBtn');
            const text = `${getShareText()}\n${window.location.href}`;
            try {
                await navigator.clipboard.writeText(text);
                const originalHtml = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> コピー完了！`;
                copyBtn.classList.remove('bg-[#3BA29B]', 'hover:bg-[#1F7068]');
                copyBtn.classList.add('bg-emerald-600');
                lucide.createIcons();
                setTimeout(() => {
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.classList.remove('bg-emerald-600');
                    copyBtn.classList.add('bg-[#3BA29B]', 'hover:bg-[#1F7068]');
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                alert('クリップボードへのコピーに失敗しました。');
            }
        }
    </script>
